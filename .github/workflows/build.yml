name: Build Verus Miner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Precompiled Miner Sources
      run: |
        git clone https://github.com/monkins1010/ccminer.git
        cd ccminer
        ls -la

    - name: Upload Artifacts Package
      uses: actions/upload-artifact@v4
      with:
        name: verus-miner-source
        path: ccminer/
